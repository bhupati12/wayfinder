name: importer-guides

# Runs only when the importer or code it depends on changes.
on:
  push:
    branches: [main]
    paths:
      - "src/dotnet/guides/importer-guides/**"
      - "src/dotnet/guides/db-entities-guides/**"
      - "src/dotnet/domains-shared/**"
      - "src/dotnet/connector-llm/**"
      - "src/dotnet/Directory.Build.props"
      - ".github/workflows/importer-guides.yaml"
      - "helm/importer-guides/**"
      - "eval/**"
  pull_request:
    paths:
      - "src/dotnet/guides/importer-guides/**"
      - "src/dotnet/guides/db-entities-guides/**"
      - "src/dotnet/domains-shared/**"
      - "src/dotnet/connector-llm/**"
      - "src/dotnet/Directory.Build.props"
      - ".github/workflows/importer-guides.yaml"
      - "helm/importer-guides/**"
      - "eval/**"

permissions:
  contents: read

concurrency:
  group: importer-guides-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools and packages
        working-directory: src/dotnet
        run: |
          dotnet tool restore
          dotnet restore guides/importer-guides/GuidesImporter.Tests/GuidesImporter.Tests.csproj
          dotnet restore connector-llm/Llm.Infrastructure.Tests/Llm.Infrastructure.Tests.csproj

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check src/dotnet/guides/importer-guides src/dotnet/guides/db-entities-guides src/dotnet/domains-shared src/dotnet/connector-llm

      - name: Build (warnings are errors)
        working-directory: src/dotnet
        run: |
          dotnet build guides/importer-guides/GuidesImporter.Tests/GuidesImporter.Tests.csproj --no-restore --configuration Release
          dotnet build connector-llm/Llm.Infrastructure.Tests/Llm.Infrastructure.Tests.csproj --no-restore --configuration Release

      - name: Test with coverage
        working-directory: src/dotnet
        run: |
          dotnet test guides/importer-guides/GuidesImporter.Tests/GuidesImporter.Tests.csproj --no-build --configuration Release \
            --collect:"XPlat Code Coverage" --results-directory ../../TestResults --logger "trx;LogFileName=importer.trx"
          dotnet test connector-llm/Llm.Infrastructure.Tests/Llm.Infrastructure.Tests.csproj --no-build --configuration Release \
            --collect:"XPlat Code Coverage" --results-directory ../../TestResults --logger "trx;LogFileName=llm.trx"

      - name: Coverage report
        if: always()
        run: |
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: importer-guides-test-results
          path: |
            TestResults
            coverage

  image:
    name: Build image
    needs: [secrets, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: src/dotnet
          file: src/dotnet/guides/importer-guides/Dockerfile
          tags: wayfinder/importer-guides:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
